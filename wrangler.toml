name = "bolao-copa-2026-worker"
main = "bolao-worker.js"
compatibility_date = "2024-01-01"

# Cron Triggers — roda a cada 1 minuto nos horários dos jogos
# O Worker internamente controla o intervalo de 1min30s via KV/timestamp
[triggers]
crons = [
  "* 21-23 13 6 *",   # Brasil x Marrocos  — 13/06 às 19h BRT (22h-00h UTC)
  "* 0-2 20 6 *",     # Brasil x Haiti      — 19/06 às 21h30 BRT (00h-02h UTC dia 20)
  "* 21-23 24 6 *",   # Escócia x Brasil    — 24/06 às 19h BRT (22h-00h UTC)
]
